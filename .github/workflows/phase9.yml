name: Phase 9 Judge Demo Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase9-judge-demo, phase9-judge-gate]

jobs:
  judge-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate frontend JavaScript syntax
        run: node --check frontend/app.js

      - name: Run Phase 9 judge contract tests
        run: python -m pytest -q tests/test_phase9_judge_demo.py

      - name: Run complete regression suite
        run: python -m pytest -q
