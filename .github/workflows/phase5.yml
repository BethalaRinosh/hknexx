name: Phase 5 ATT&CK Intelligence Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase5-attack-intelligence]

jobs:
  phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Run Phase 5 gate
        run: python -m pytest -q tests/test_phase5_attack_intel.py
