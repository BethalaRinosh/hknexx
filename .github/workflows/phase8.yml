name: Phase 8 Public Dataset Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase8-public-validation, phase8-apt29-ground-truth]

jobs:
  phase8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned public Sysmon corpus
        uses: actions/checkout@v4
        with:
          repository: splunk/attack_data
          path: external/attack_data
          fetch-depth: 1
          lfs: true
          sparse-checkout: |
            datasets/attack_techniques/T1070/atomic_red_team/windows-sysmon.log
          sparse-checkout-cone-mode: false
      - name: Verify public corpus
        shell: bash
        run: |
          set -euo pipefail
          test -s external/attack_data/datasets/attack_techniques/T1070/atomic_red_team/windows-sysmon.log



      - name: Download public CERT labeled event sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/cert
          curl -fsSL --retry 4 --retry-delay 2             "https://zenodo.org/records/19135764/files/cert_preprocessed_ml_comparison.csv?download=1"             -o external/cert/cert_preprocessed_ml_comparison.csv
          test -s external/cert/cert_preprocessed_ml_comparison.csv
          echo "Downloaded bytes: $(wc -c < external/cert/cert_preprocessed_ml_comparison.csv)"
          echo "CERT schema preview:"
          head -n 3 external/cert/cert_preprocessed_ml_comparison.csv

      - name: Run CERT public benchmark
        run: |
          python -m pytest -q tests/test_phase8_cert_benchmark.py
          python - <<'PY'
          from pathlib import Path
          from backend.cert_benchmark import evaluate_cert

          path = Path("external/cert/cert_preprocessed_ml_comparison.csv")
          result = evaluate_cert(path)
          print(result)
          assert result.status == "validated"
          assert result.total_events >= 4000
          assert result.malicious_cases > 0
          assert result.benign_cases > 0
          assert 0.15 <= result.malicious_cases / result.total_cases <= 0.60
          PY

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Run Phase 8 evaluator gate
        env:
          IMW_SPLUNK_T1070_SYSMON_PATH: external/attack_data/datasets/attack_techniques/T1070/atomic_red_team/windows-sysmon.log
        run: |
          python -m pytest -q tests/test_phase8_public_eval.py
          python - <<'PY'
          import os
          from pathlib import Path
          from backend.public_eval import evaluate_public_dataset, load_manifest

          manifest = load_manifest(Path("backend/data/public_dataset_manifest.json"))
          spec = next(x for x in manifest if x.dataset_id == "SPLUNK_ATTACK_DATA_T1070_SYSMON")
          result = evaluate_public_dataset(spec)
          print(result)
          assert result.available
          assert result.status == "validated"
          assert result.total_records > 0
          assert result.normalized_events > 0
          assert result.normalization_errors == 0
          PY

      - name: Download raw CERT r4.2 public mirror
        if: github.head_ref == 'phase8-cert-raw-execution' || github.ref == 'refs/heads/phase8-cert-raw-execution'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/cert_raw
          curl -fL --retry 5 --retry-delay 3 --connect-timeout 30 --max-time 1800 \
            "https://www.kaggle.com/api/v1/datasets/download/andrihjonior/cert-insider-threat-dataset-r4-2" \
            -o external/cert_raw/cert-r4.2.zip
          test -s external/cert_raw/cert-r4.2.zip
          unzip -t external/cert_raw/cert-r4.2.zip >/dev/null

      - name: Extract raw CERT r4.2 files
        if: github.head_ref == 'phase8-cert-raw-execution' || github.ref == 'refs/heads/phase8-cert-raw-execution'
        shell: bash
        run: |
          set -euo pipefail
          ZIP=external/cert_raw/cert-r4.2.zip
          find_entry() {
            local pattern="$1"
            unzip -Z1 "$ZIP" | awk -v p="$pattern" '$0 ~ p {print; exit}'
          }
          for pair in \
            "logon.csv|(^|/)r4[.]2/logon[.]csv$" \
            "device.csv|(^|/)r4[.]2/device[.]csv$" \
            "file.csv|(^|/)r4[.]2/file[.]csv$" \
            "insiders.csv|(^|/)answers/insiders[.]csv$"; do
            name="${pair%%|*}"
            pattern="${pair#*|}"
            entry="$(find_entry "$pattern")"
            test -n "$entry"
            unzip -p "$ZIP" "$entry" > "external/cert_raw/$name"
          done
          python scripts/verify_cert_raw_layout.py --data-dir external/cert_raw
          LOGON_ROWS="$(($(wc -l < external/cert_raw/logon.csv) - 1))"
          DEVICE_ROWS="$(($(wc -l < external/cert_raw/device.csv) - 1))"
          FILE_ROWS="$(($(wc -l < external/cert_raw/file.csv) - 1))"
          INSIDER_ROWS="$(($(wc -l < external/cert_raw/insiders.csv) - 1))"
          echo "CERT_RAW_LOGON_ROWS=$LOGON_ROWS"
          echo "CERT_RAW_DEVICE_ROWS=$DEVICE_ROWS"
          echo "CERT_RAW_FILE_ROWS=$FILE_ROWS"
          echo "CERT_RAW_INSIDER_ROWS=$INSIDER_ROWS"
          test "$LOGON_ROWS" -ge 800000
          test "$DEVICE_ROWS" -ge 350000
          test "$FILE_ROWS" -ge 500000
          test "$INSIDER_ROWS" -ge 180

      - name: Run raw CERT r4.2 benchmark
        if: github.head_ref == 'phase8-cert-raw-execution' || github.ref == 'refs/heads/phase8-cert-raw-execution'
        run: |
          python scripts/run_cert_raw_benchmark.py \
            --data-dir external/cert_raw \
            --json-out external/cert_raw/phase8_cert_raw_result.json

      - name: Upload raw CERT result
        if: github.head_ref == 'phase8-cert-raw-execution' || github.ref == 'refs/heads/phase8-cert-raw-execution'
        uses: actions/upload-artifact@v4
        with:
          name: phase8-cert-raw-result
          path: external/cert_raw/phase8_cert_raw_result.json
          if-no-files-found: error
