name: Phase 8 Public Dataset Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase8-public-validation]

jobs:
  phase8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Fetch pinned public Sysmon corpus
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v git-lfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi
          git lfs install
          git clone --filter=blob:none --no-checkout --depth 1 https://github.com/splunk/attack_data.git /tmp/attack_data
          cd /tmp/attack_data
          git lfs pull --include="datasets/attack_techniques/T1070/atomic_red_team/windows-sysmon.log"
          test -s datasets/attack_techniques/T1070/atomic_red_team/windows-sysmon.log

      - name: Run full regression suite
        run: python -m pytest -q

      - name: Run Phase 8 evaluator gate
        env:
          IMW_SPLUNK_T1070_SYSMON_PATH: /tmp/attack_data/datasets/attack_techniques/T1070/atomic_red_team/windows-sysmon.log
        run: |
          python -m pytest -q tests/test_phase8_public_eval.py
          python - <<'PY'
          import os
          from pathlib import Path
          from backend.public_eval import evaluate_public_dataset, load_manifest

          manifest = load_manifest(Path("backend/data/public_dataset_manifest.json"))
          spec = next(x for x in manifest if x.dataset_id == "SPLUNK_ATTACK_DATA_T1070_SYSMON")
          result = evaluate_public_dataset(spec)
          print(result)
          assert result.available
          assert result.status == "validated"
          assert result.total_records > 0
          assert result.normalized_events > 0
          assert result.normalization_errors == 0
          PY