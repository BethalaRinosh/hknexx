name: Phase 8 Raw CERT Execution

on:
  pull_request:
    branches: [main]
  push:
    branches: [phase8-cert-raw-execution]
  workflow_dispatch:

jobs:
  cert-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download raw CERT r4.2 files from public mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p external/cert_raw

          download_one() {
            local remote_path="$1"
            local output="$2"
            local encoded
            encoded="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$remote_path")"
            local archive="external/cert_raw/$(basename "$output").zip"
            echo "Downloading $remote_path"
            curl -fL --retry 5 --retry-delay 2 --connect-timeout 30 --max-time 900 \
              "https://www.kaggle.com/api/v1/datasets/download/andrihjonior/cert-insider-threat-dataset-r4-2?file_name=$encoded" \
              -o "$archive"
            test -s "$archive"
            if unzip -t "$archive" >/dev/null 2>&1; then
              local entry
              entry="$(unzip -Z1 "$archive" | head -n 1)"
              test -n "$entry"
              unzip -p "$archive" "$entry" > "external/cert_raw/$output"
            else
              cp "$archive" "external/cert_raw/$output"
            fi
            test -s "external/cert_raw/$output"
            rm -f "$archive"
          }

          download_one "r4.2/logon.csv" "logon.csv"
          download_one "r4.2/device.csv" "device.csv"
          download_one "r4.2/file.csv" "file.csv"
          download_one "answers/insiders.csv" "insiders.csv"

      - name: Verify raw CERT layout and signatures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify_cert_raw_layout.py --data-dir external/cert_raw

          LOGON_ROWS="$(($(wc -l < external/cert_raw/logon.csv) - 1))"
          DEVICE_ROWS="$(($(wc -l < external/cert_raw/device.csv) - 1))"
          FILE_ROWS="$(($(wc -l < external/cert_raw/file.csv) - 1))"
          INSIDER_ROWS="$(($(wc -l < external/cert_raw/insiders.csv) - 1))"

          echo "CERT_RAW_LOGON_ROWS=$LOGON_ROWS"
          echo "CERT_RAW_DEVICE_ROWS=$DEVICE_ROWS"
          echo "CERT_RAW_FILE_ROWS=$FILE_ROWS"
          echo "CERT_RAW_INSIDER_ROWS=$INSIDER_ROWS"

          test "$LOGON_ROWS" -ge 800000
          test "$DEVICE_ROWS" -ge 350000
          test "$FILE_ROWS" -ge 500000
          test "$INSIDER_ROWS" -ge 180

      - name: Run raw CERT r4.2 benchmark
        run: |
          python scripts/run_cert_raw_benchmark.py \
            --data-dir external/cert_raw \
            --json-out external/cert_raw/phase8_cert_raw_result.json

      - name: Upload raw CERT result
        uses: actions/upload-artifact@v4
        with:
          name: phase8-cert-raw-result
          path: external/cert_raw/phase8_cert_raw_result.json
          if-no-files-found: error
