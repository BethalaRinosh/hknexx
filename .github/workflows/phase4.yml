name: Phase 4 Behavior Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase4-behavior-baseline]

jobs:
  phase4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Run Phase 4 gate
        run: python -m pytest -q tests/test_phase4_behavior.py