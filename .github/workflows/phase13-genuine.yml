name: Phase 13 - Genuine Generalization

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_phase13_genuine_generalization.py"
      - ".github/workflows/phase13-genuine.yml"
  workflow_dispatch:

jobs:
  generalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests/test_phase13_genuine_generalization.py
