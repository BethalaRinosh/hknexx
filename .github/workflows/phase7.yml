name: Phase 7 Grounded Investigator Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase7-grounded-investigator]

jobs:
  phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Run Phase 7 gate
        run: python -m pytest -q tests/test_phase7_investigator.py