name: Phase 6 Attack Reconstruction Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, phase6-attack-reconstruction]

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full regression suite
        run: python -m pytest -q
      - name: Run Phase 6 gate
        run: python -m pytest -q tests/test_phase6_reconstruction.py